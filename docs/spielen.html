<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spielen – Grizzlys Arcade</title>
<link rel="icon" href="img/icon1024.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--eis:#EDF3F7;--baer:#1B1C1F;--orange:#FF6A00;--kreide:#fff;--grau:#5B6570}
*{box-sizing:border-box;margin:0}
body{background:var(--eis);color:var(--baer);font:400 17px/1.5 "Public Sans",system-ui,sans-serif;min-height:100vh}
header{border-bottom:2px solid var(--baer);background:var(--eis)}
header .w{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
header img{width:40px;height:40px;border-radius:50%}
header b{font:900 21px "Archivo";font-stretch:75%}
header a.back{margin-left:auto;font-weight:700;text-decoration:none;border:2px solid var(--baer);padding:7px 14px;border-radius:999px}
header a.back:hover{background:var(--baer);color:#fff}
main{max-width:1000px;margin:0 auto;padding:22px 16px 60px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:28px;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
h1{font:900 clamp(44px,8vw,84px)/.95 "Archivo";font-stretch:75%;margin-bottom:10px}
p.s{color:var(--grau);max-width:46ch;margin-bottom:22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:2px solid var(--baer);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .12s}
.tile:hover,.tile:focus-visible{transform:translateY(-3px);box-shadow:5px 5px 0 var(--orange)}
.tile:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.tile img{width:100%;aspect-ratio:1;object-fit:cover;object-position:top;background:var(--baer);display:block}
.tile span{padding:8px 11px 10px;font:800 16px/1.1 "Archivo";font-stretch:80%;display:block}
.tile small{display:block;font:400 12px "Public Sans";color:var(--grau);margin-top:3px}
.tile.on{box-shadow:5px 5px 0 var(--orange);border-color:var(--orange)}
.stage{position:sticky;top:12px}
.frame{position:relative;width:100%;max-width:360px;margin:0 auto;aspect-ratio:9/16;background:#0d1a2b;border:3px solid var(--baer);border-radius:26px;overflow:hidden;box-shadow:10px 12px 0 var(--orange)}
canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:rgba(13,26,43,.88);color:#fff;padding:24px}
.ov[hidden]{display:none}
.ov h2{font:900 40px/1 "Archivo";font-stretch:75%}
.ov p{color:#c8d3df;font-size:16px;max-width:26ch}
.ov button{font:700 17px "Public Sans";background:var(--orange);color:var(--baer);border:2px solid #fff;border-radius:999px;padding:11px 22px;cursor:pointer;margin-top:6px}
.ov button.alt{background:transparent;color:#fff}
.hint{text-align:center;color:var(--grau);font-size:14px;margin-top:22px}
</style>
</head>
<body>
<header><div class="w"><img src="img/icon1024.png" alt=""><b>Grizzlys Arcade</b><a class="back" href="index.html">Zur Startseite</a></div></header>
<main>
  <section>
    <h1>Gleich hier spielen</h1>
    <p class="s">Sieben Spiele aus der App, direkt im Browser. Am Handy mit dem Finger, am Computer mit der Maus. Alle 50 Spiele gibt es in der App.</p>
    <div class="tiles" id="tiles"></div>
  </section>
  <section class="stage">
    <div class="frame">
      <canvas id="cv" width="360" height="640" aria-label="Spielfeld"></canvas>
      <div class="ov" id="ov"></div>
    </div>
    <p class="hint" id="best"></p>
  </section>
</main>
<script src="games.js"></script>
</body>
</html>
