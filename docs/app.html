<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grizzlys Arcade – Web-App</title>
<meta name="theme-color" content="#0b1524">
<link rel="icon" href="img/icon1024.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1524;--card:#14253b;--line:#2a4466;--or:#FF6A00;--ice:#38c8ff;--tx:#fff;--mut:#9fb2c8;--ok:#1fbf5b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:400 17px/1.45 "Public Sans",system-ui,sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 80% -10%,rgba(255,106,0,.22),transparent 45%),radial-gradient(circle at 0% 100%,rgba(56,200,255,.14),transparent 45%);pointer-events:none}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;min-height:58px}
.bar h2{font:900 26px/1 "Archivo";font-stretch:75%;flex:1}
.ib{all:unset;cursor:pointer;width:42px;height:42px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 22px "Public Sans";color:#fff}
.ib:hover,.ib:focus-visible{border-color:var(--or)}
.body{flex:1;overflow:auto;padding:6px 16px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit}
.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font:900 24px/1 "Archivo";font-stretch:80%;padding:18px 20px;border-radius:18px;background:var(--or);color:#1B1C1F;border:2px solid #fff;display:block;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.alt{background:transparent;color:#fff;border-color:var(--line)}
.btn.alt:hover{border-color:var(--or)}
.btn.sm{font-size:19px;padding:13px 16px}
.btn[disabled]{opacity:.4;cursor:default}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}
.mut{color:var(--mut);font-size:15px}
.hero{text-align:center;padding:10px 0 4px}
.hero img{width:118px;height:118px;border-radius:50%;border:3px solid var(--or);box-shadow:0 0 34px rgba(255,106,0,.55)}
.hero h1{font:900 46px/.95 "Archivo";font-stretch:70%;margin-top:12px;letter-spacing:.01em}
.hero h1 b{color:var(--or)}
.lvl{display:flex;align-items:center;gap:12px}
.lvl .n{font:900 34px "Archivo";font-stretch:70%;color:var(--or);min-width:52px}
.xp{flex:1;height:12px;background:#0a1220;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--or),#ffb36b)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:11px 16px;border-radius:99px;border:2px solid var(--line);font-weight:700;text-align:center;min-width:48px}
.chip[aria-pressed=true]{background:var(--or);color:#1B1C1F;border-color:#fff}
.chip:focus-visible{outline:3px solid var(--ice)}
label.f{display:block;font-weight:700;margin-bottom:6px}
input.t{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#0a1220;color:#fff;font:inherit}
input.t:focus{outline:none;border-color:var(--or)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.tile:hover,.tile:focus-visible{border-color:var(--or)}
.tile img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top;display:block;background:#000}
.tile .t{padding:9px 12px 11px;font:800 17px/1.1 "Archivo";font-stretch:80%}
.tile small{display:block;font:400 12.5px "Public Sans";color:var(--mut);margin-top:3px}
.tile.off{opacity:.45;cursor:default}
.tile.off:hover{border-color:var(--line)}
h3.sec{font:900 22px "Archivo";font-stretch:75%;margin:6px 0 -2px}
.intro img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border-radius:16px;border:2px solid var(--or);display:block}
.rank{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.rank.win{border-color:var(--or);box-shadow:0 0 22px rgba(255,106,0,.35)}
.rank .p{font:900 26px "Archivo";font-stretch:70%;color:var(--or);width:30px}
.rank .nm{flex:1;font-weight:700}
.rank .sc{font-weight:700;color:var(--mut);text-align:right}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 10px max(10px,env(safe-area-inset-bottom));position:relative}
.frame{position:relative;border:3px solid var(--line);border-radius:22px;overflow:hidden;background:#0d1a2b}
canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:rgba(11,21,36,.92);padding:22px}
.ov[hidden]{display:none}
.ov h2{font:900 38px/1 "Archivo";font-stretch:75%}
.ov .btn{width:100%;max-width:260px}
.ov p{color:var(--mut)}
.big{font:900 54px/1 "Archivo";font-stretch:70%;color:var(--or)}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:190px;margin:8px 0}
.pod div{flex:1;max-width:110px;background:var(--card);border:2px solid var(--line);border-radius:14px 14px 0 0;text-align:center;padding:8px 4px;font-weight:700;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.pod div b{font:900 32px "Archivo";font-stretch:70%;color:var(--or)}
.pod .w{border-color:var(--or);background:#2a1a0d}
a.lnk{color:var(--ice);font-weight:700;text-align:center;display:block;text-decoration:none;padding:6px}
table{width:100%;border-collapse:collapse}
td{padding:9px 6px;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:700}
.coin{display:inline-block;width:.9em;height:.9em;border-radius:50%;background:#ffc400;border:2px solid #b88700;vertical-align:-.1em;margin-right:4px}
.top{display:flex;gap:10px;align-items:center}
.pill{padding:6px 12px;border-radius:99px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:15px;white-space:nowrap}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:2px}
.tabs .chip{white-space:nowrap}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card);border:2px solid var(--line)}
.item.on{border-color:var(--or)}
.item .i{flex:1;min-width:0}.item .i b{display:block}
.item .btn{padding:10px 14px;font-size:17px;border-radius:14px}
.sk{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.sk .item{flex-direction:column;text-align:center;gap:6px}
.dot{position:absolute;top:6px;right:8px;width:12px;height:12px;border-radius:50%;background:#e22;border:2px solid #fff}
.rel{position:relative}
.pb{height:10px;background:#0a1220;border-radius:99px;overflow:hidden;border:1px solid var(--line)}.pb i{display:block;height:100%;background:var(--ok)}
.wheel{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:8px auto}
.wheel .w{position:absolute;inset:0;border-radius:50%;border:4px solid #fff;transition:transform 4.2s cubic-bezier(.12,.7,.1,1);box-shadow:0 0 30px rgba(255,106,0,.4)}
.wheel .w span{position:absolute;left:50%;top:50%;transform-origin:0 0;font:900 22px "Archivo";text-shadow:0 1px 3px #0008;text-align:center;width:70px;margin-left:-35px;line-height:1}
.wheel .w small{display:block;font:700 11px "Public Sans"}
.wheel .pt{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;border:14px solid transparent;border-top:26px solid #fff;z-index:2}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:20;pointer-events:none;animation:cf 2.6s ease-in forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.cf{display:none}.wheel .w{transition-duration:.01s}}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script src="rules.js"></script>
<script src="meta.js"></script>
<script src="games.js"></script>
<script src="games2.js"></script>
<script src="games3.js"></script>
<script src="games4.js"></script>
<script src="games5.js"></script>
<script src="app.js"></script>
</body>
</html>
