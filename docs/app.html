<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grizzlys Arcade – Web-App</title>
<meta name="theme-color" content="#0b1524">
<link rel="icon" href="img/icon1024.png">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d17;--panel:#1c1c2b;--or:#ff8a00;--blue:#40ccff;--green:#40ff73;--pink:#ff4db3;--yel:#ffd61a;--red:#ff4d4d;--tx:#fff;--mut:rgba(255,255,255,.62);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:600 15px/1.35 "Avenir Next","Avenir",Figtree,"Nunito Sans",system-ui,sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% -5%,rgba(255,138,0,.30),transparent 55%),radial-gradient(ellipse at 50% 110%,rgba(64,204,255,.12),transparent 55%),linear-gradient(rgba(255,138,0,.05) 1px,transparent 1px) 0 0/30px 30px,linear-gradient(90deg,rgba(255,138,0,.05) 1px,transparent 1px) 0 0/30px 30px;pointer-events:none}
body::after{content:"";position:fixed;left:50%;top:50%;width:min(560px,120vw);aspect-ratio:1;transform:translate(-50%,-50%);background:url(img/logo.png) center/contain no-repeat;opacity:.06;pointer-events:none}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
b,.h{font-weight:900}
.h{font-family:inherit;text-transform:uppercase;letter-spacing:.01em}
.bar{display:flex;align-items:center;gap:12px;padding:max(12px,env(safe-area-inset-top)) 18px 10px}
.bar h2{font-weight:900;font-size:26px;text-transform:uppercase;flex:1;line-height:1}
.ib{all:unset;cursor:pointer;flex:none;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,138,0,.7);background:rgba(255,138,0,.12);display:grid;place-items:center;font-weight:900;font-size:24px;color:#fff;box-shadow:0 0 12px rgba(255,138,0,.25)}
.ib:focus-visible,.btn:focus-visible,.chip:focus-visible,.tile:focus-visible,.card:focus-visible{outline:3px solid #fff;outline-offset:2px}
.coinp{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;border:2px solid rgba(255,214,26,.75);background:rgba(255,214,26,.1);font-weight:900;font-size:17px;box-shadow:0 0 12px rgba(255,214,26,.2)}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe88a,#ffc400 60%,#c98f00);border:2px solid #b88700;position:relative;vertical-align:middle}
.coin::after{content:"";position:absolute;inset:4px;border-radius:50%;border:2px solid rgba(160,110,0,.6)}
.coin.s{width:15px;height:15px;border-width:1.5px}.coin.s::after{inset:3px;border-width:1.5px}
.body{flex:1;overflow:auto;padding:4px 18px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.foot{padding:8px 18px max(14px,env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;text-align:center;font-weight:900;font-size:21px;text-transform:uppercase;letter-spacing:.03em;padding:0 18px;min-height:58px;border-radius:18px;background:linear-gradient(#ffa21f,#ff8a00 55%,#f07400);color:#1a1000;border:2px solid rgba(255,214,150,.9);box-shadow:0 0 22px rgba(255,138,0,.45),inset 0 2px 0 rgba(255,255,255,.35)}
.btn:active{transform:scale(.97)}
.btn.blue{background:linear-gradient(#5fd6ff,#40ccff 55%,#2eb6ec);border-color:#c2ecff;box-shadow:0 0 22px rgba(64,204,255,.45),inset 0 2px 0 rgba(255,255,255,.4);color:#00202c}
.btn.green{background:linear-gradient(#66ff8d,#40ff73 55%,#2fe65f);border-color:#c8ffd6;box-shadow:0 0 22px rgba(64,255,115,.4),inset 0 2px 0 rgba(255,255,255,.4);color:#012a0e}
.btn.red{background:rgba(255,77,77,.75);border-color:rgba(255,160,160,.6);color:#fff;box-shadow:none;font-size:16px;min-height:48px}
.btn.alt{background:rgba(255,255,255,.06);color:#fff;border-color:var(--line);box-shadow:none}
.btn.sm{min-height:46px;font-size:17px;border-radius:14px}
.btn[disabled]{opacity:.45;cursor:default;filter:saturate(.6)}
.row{display:flex;gap:10px}
.card{background:linear-gradient(rgba(255,255,255,.04),rgba(255,255,255,0) 40%),var(--panel);border:2px solid var(--c,rgba(255,138,0,.6));border-radius:18px;padding:14px;position:relative}
button.card{all:unset;box-sizing:border-box;display:block;cursor:pointer;background:linear-gradient(rgba(255,255,255,.04),rgba(255,255,255,0) 40%),var(--panel);border:2px solid var(--c,rgba(255,138,0,.6));border-radius:18px;padding:14px;width:100%}
.mut{color:var(--mut);font-size:14px;font-weight:600}
.lab{font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;background:rgba(255,255,255,.08);border:2px solid var(--line);font-weight:900;font-size:14px}
.lv{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:99px;border:2px solid rgba(255,138,0,.6);background:rgba(255,138,0,.1)}
.lv .n{width:26px;height:26px;border-radius:50%;background:var(--or);color:#1a1000;display:grid;place-items:center;font-weight:900;font-size:14px}
.lv small{display:block;font-weight:900;font-size:10px;letter-spacing:.08em;text-transform:uppercase;line-height:1.1}
.lv .xp{width:62px;height:4px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:3px}.lv .xp i{display:block;height:100%;background:var(--or)}
.logo{width:min(190px,46vw);aspect-ratio:1;margin:0 auto;display:block;border-radius:50%;filter:drop-shadow(0 0 26px rgba(255,138,0,.65))}
.t1{text-align:center;font-weight:900;font-size:42px;line-height:1;color:var(--or);letter-spacing:.02em;text-shadow:0 0 22px rgba(255,138,0,.6)}
.t2{text-align:center;font-weight:900;font-size:16px;letter-spacing:.5em;margin-top:6px;padding-left:.5em}
.strip{display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:18px;border:2px solid rgba(255,255,255,.25);background:rgba(28,28,43,.8);cursor:pointer;width:100%}
.strip .p{flex:1;text-align:center;font-weight:900;font-size:11px;min-width:0}
.strip .p span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bear{display:block;margin:0 auto;object-fit:contain}
.mini{all:unset;box-sizing:border-box;cursor:pointer;flex:1;height:62px;border-radius:16px;border:2px solid var(--c);background:rgba(28,28,43,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:900;font-size:11px;text-transform:uppercase;position:relative;color:#fff}
.mini svg{width:22px;height:22px;stroke:var(--c);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:6px;right:8px;width:12px;height:12px;border-radius:50%;background:#ff3b30;border:2px solid #fff}
.feat{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;border:2px solid var(--c);background:rgba(28,28,43,.9);cursor:pointer;width:100%;text-align:left}
.feat img{width:92px;height:58px;object-fit:cover;object-position:top;border-radius:12px;border:2px solid rgba(255,255,255,.15)}
.feat small{display:block;font-weight:900;font-size:10px;color:var(--or);letter-spacing:.1em;text-transform:uppercase}
.feat b{font-size:18px}
.feat .go{margin-left:auto;width:38px;height:38px;border-radius:50%;background:var(--c);color:#000;display:grid;place-items:center;font-size:15px;flex:none}
.chips{display:flex;gap:8px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:center;padding:10px 6px;border-radius:12px;border:2px solid var(--line);background:rgba(255,255,255,.06);font-weight:900;font-size:14px;text-transform:uppercase;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--cc,var(--or));border-color:var(--cc,var(--or));color:#1a1000;box-shadow:0 0 14px var(--cc,var(--or))}
.pc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 10px;border-radius:18px;border:2px solid var(--c);background:var(--panel);position:relative}
.pc.off{opacity:.55;border-color:var(--line)}
.pc.off .bear{filter:grayscale(1) brightness(.6)}
.pc .cyc{all:unset;cursor:pointer;position:absolute;right:8px;top:70px;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:900}
.pc input{width:100%;text-align:center;padding:8px;border-radius:10px;border:0;background:rgba(0,0,0,.35);color:#fff;font:900 15px inherit;font-family:inherit}
.pc .nm{font-weight:900;padding:8px 0;font-size:15px;color:#fff}
.modes{display:flex;gap:6px;width:100%}
.modes button{all:unset;cursor:pointer;flex:1;height:32px;border-radius:9px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:16px;font-weight:900}
.modes button[aria-pressed=true]{background:var(--c);color:#1a1000}
.modes svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.diff{display:flex;gap:6px}
.diff button{all:unset;cursor:pointer;flex:1;height:54px;border-radius:12px;background:rgba(255,255,255,.07);border:2px solid color-mix(in srgb,var(--c) 45%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;padding-bottom:6px;font-weight:900;font-size:12px}
.diff button[aria-pressed=true]{background:var(--c);color:#000;box-shadow:0 0 12px var(--c)}
.diff i{display:flex;gap:1.5px;align-items:flex-end;height:22px}.diff i s{display:block;width:5px;border-radius:9px;background:rgba(255,255,255,.2)}
.diff button[aria-pressed=true] i s.on{background:#000}.diff button i s.on{background:var(--c)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;border-radius:18px;border:2px solid var(--c);background:var(--panel);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 14px color-mix(in srgb,var(--c) 30%,transparent)}
.tile img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;display:block;background:#000;border-bottom:2px solid color-mix(in srgb,var(--c) 40%,transparent)}
.tile .t{padding:8px 11px 9px}
.tile b{display:block;font-size:15px;line-height:1.15}
.tile .m{display:flex;justify-content:space-between;margin-top:3px;font-weight:900;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.tile .m span:first-child{color:var(--c)}.tile .m span:last-child{color:var(--mut)}
.tile.off{opacity:.45}
.tile.dis{opacity:.4}
.sk{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 8px;border-radius:18px;border:2px solid var(--line);background:rgba(255,255,255,.04)}
.sk.on{border-color:var(--or);background:rgba(255,138,0,.09)}
.sk b{font-size:15px}
.sk .n{display:flex;gap:6px;margin-top:6px}
.sk .n button{all:unset;cursor:pointer;width:34px;height:28px;border-radius:8px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:900;font-size:13px}
.sk .n button[aria-pressed=true]{background:var(--c);color:#1a1000}
.sk .price{all:unset;cursor:pointer;margin-top:6px;width:90%;height:30px;border-radius:9px;background:rgba(255,255,255,.35);color:#111;display:flex;gap:6px;align-items:center;justify-content:center;font-weight:900;font-size:15px}
.sk .price[disabled]{opacity:.5}
.it{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.04)}
.it.on{border-color:var(--or)}.it.lock{opacity:.6}
.it .i{flex:1;min-width:0}.it .i b{display:block;font-size:16px}
.it .ic{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:22px;flex:none}
.it .btn{width:auto;min-height:38px;padding:0 14px;font-size:15px;border-radius:12px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;border:2px solid var(--line);background:rgba(28,28,43,.9)}
.stat .ic{font-size:20px}.stat b{font-size:22px;line-height:1}.stat span{font-size:10px;font-weight:900;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rec{display:flex;align-items:center;gap:10px;padding:8px 0;font-weight:800}
.rec i{width:12px;height:12px;border-radius:50%;flex:none}.rec span{margin-left:auto;color:var(--or);font-weight:900}.rec span.z{color:var(--mut)}
.pb{height:6px;background:rgba(255,255,255,.14);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:var(--or);border-radius:9px}
.rew{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:rgba(255,214,26,.14);color:var(--yel);font-weight:900;font-size:13px}
.tg{all:unset;cursor:pointer;width:52px;height:30px;border-radius:99px;background:rgba(255,255,255,.22);position:relative;flex:none;transition:.2s}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tg[aria-checked=true]{background:var(--or)}.tg[aria-checked=true]::after{left:25px}
.trow{display:flex;align-items:center;gap:12px;font-weight:900;font-size:16px;padding:9px 0}
.lrow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:16px;border-radius:16px;border:2px solid rgba(255,138,0,.5);background:var(--panel);font-weight:900;font-size:16px}
.lrow span{margin-left:auto;color:var(--mut)}
.big{font-weight:900;font-size:54px;line-height:1;color:var(--or);text-transform:uppercase}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 10px max(10px,env(safe-area-inset-bottom));position:relative}
.frame{position:relative;border:3px solid rgba(255,138,0,.55);border-radius:22px;overflow:hidden;background:#0d1a2b;box-shadow:0 0 24px rgba(255,138,0,.25)}
canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:rgba(13,13,23,.93);padding:22px}
.ov[hidden]{display:none}
.ov h2{font-weight:900;font-size:36px;line-height:1;text-transform:uppercase}
.ov .btn{max-width:280px}
.ov p{color:var(--mut)}
.rank{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;background:var(--panel);border:2px solid var(--line)}
.rank.win{border-color:var(--or);box-shadow:0 0 22px rgba(255,138,0,.35)}
.rank .p{font-weight:900;font-size:26px;color:var(--or);width:28px}
.rank .nm{flex:1;font-weight:900;font-size:17px}.rank .sc{font-weight:900;color:var(--mut);text-align:right}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:210px;margin:8px 0}
.pod>div{flex:1;max-width:112px;background:var(--panel);border:2px solid var(--line);border-radius:14px 14px 0 0;text-align:center;padding:8px 4px;font-weight:900;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.pod>div>b{font-size:30px;color:var(--or)}.pod .w{border-color:var(--or);background:rgba(255,138,0,.12)}
a.lnk{color:var(--blue);font-weight:900;text-align:center;display:block;text-decoration:none;padding:6px}
table{width:100%;border-collapse:collapse}td{padding:8px 4px;border-bottom:1px solid var(--line);font-weight:800}td:last-child{text-align:right;font-weight:900}
.ovl{position:absolute;inset:0;z-index:5;background:rgba(5,5,10,.86);display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 18px 20px;gap:12px;overflow:auto}
.wheel{position:relative;width:min(310px,80vw);aspect-ratio:1;margin:6px auto}
.wheel .w{position:absolute;inset:0;border-radius:50%;border:5px solid #fff;transition:transform 4.2s cubic-bezier(.12,.7,.1,1);box-shadow:0 0 34px rgba(255,138,0,.5)}
.wheel .w span{position:absolute;left:50%;top:50%;transform-origin:0 0;font-weight:900;font-size:22px;color:#111;text-align:center;width:70px;margin-left:-35px;line-height:1}
.wheel .w small{display:block;font-size:9px;font-weight:900;text-transform:uppercase}
.wheel .hubi{position:absolute;left:50%;top:50%;width:21%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:4px solid #fff;background:#111 url(img/logo.png) center/cover;z-index:2}
.wheel .pt{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:0;height:0;border:13px solid transparent;border-top:24px solid #fff;z-index:3}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:20;pointer-events:none;animation:cf 2.6s ease-in forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#fff;color:#111;font-weight:900;padding:12px 18px;border-radius:99px;z-index:30;max-width:90vw;text-align:center;display:none}
@media (prefers-reduced-motion:reduce){.cf{display:none}.wheel .w{transition-duration:.01s}}
</style>
</head>
